<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フィードバックボード</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.2.31"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide-icons"></script>
</head>
<body class="bg-gray-100">

  <div id="app" class="max-w-2xl mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4 text-center">フィードバックボード</h1>

    <div class="space-y-4">
      <!-- フィードバックリスト -->
      <div v-for="(item, index) in feedbackList" :key="item.id" class="rounded-2xl shadow-md bg-white p-4">
        <div v-if="editingId === item.id">
          <textarea v-model="editText" class="mb-2 w-full p-2 border rounded-lg"></textarea>
          <div class="flex justify-end space-x-2">
            <button @click="updateFeedback(item.id)" class="bg-blue-500 text-white px-4 py-2 rounded-lg">保存</button>
            <button @click="cancelEdit" class="bg-gray-300 text-black px-4 py-2 rounded-lg">キャンセル</button>
          </div>
        </div>
        <div v-else>
          <div class="flex justify-between items-start">
            <p class="text-base text-gray-800">{{ item.text }}</p>
            <div class="relative inline-block">
              <button @click="startEditing(item.id, item.text)" class="text-gray-500 px-2 py-1 hover:bg-gray-200 rounded-lg">
                <i class="lucide-pencil w-4 h-4"></i> 編集
              </button>
              <button @click="deleteFeedback(item.id)" class="text-gray-500 px-2 py-1 hover:bg-gray-200 rounded-lg">
                <i class="lucide-trash-2 w-4 h-4"></i> 削除
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 新しいフィードバックの入力 -->
      <div class="mt-6">
        <textarea v-model="newFeedback" placeholder="フィードバックを入力..." class="mb-2 w-full p-2 border rounded-lg"></textarea>
        <div class="flex justify-between items-center">
          <div class="space-x-2">
            <!-- テンプレート -->
            <button v-for="(tpl, idx) in templates" :key="idx" @click="applyTemplate(tpl)" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg">
              {{ tpl }}
            </button>
          </div>
          <button @click="addFeedback" class="bg-blue-500 text-white px-4 py-2 rounded-lg">送信</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          feedbackList: [
            { id: 1, text: "Great feature, very helpful!" },
            { id: 2, text: "Could use a dark mode option." },
          ],
          newFeedback: "",
          editText: "",
          editingId: null,
          templates: [
            "使いやすかったです！",
            "もう少し分かりやすいUIだと嬉しいです。",
            "機能追加を希望します。",
          ],
        };
      },
      methods: {
        addFeedback() {
          if (this.newFeedback.trim()) {
            this.feedbackList.push({ id: Date.now(), text: this.newFeedback });
            this.newFeedback = "";
          }
        },
        deleteFeedback(id) {
          this.feedbackList = this.feedbackList.filter((item) => item.id !== id);
        },
        startEditing(id, currentText) {
          this.editingId = id;
          this.editText = currentText;
        },
        cancelEdit() {
          this.editingId = null;
          this.editText = "";
        },
        updateFeedback(id) {
          const index = this.feedbackList.findIndex((item) => item.id === id);
          if (index !== -1) {
            this.feedbackList[index].text = this.editText;
          }
          this.cancelEdit();
        },
        applyTemplate(text) {
          this.newFeedback = text;
        },
      },
    });
    app.mount("#app");
  </script>
</body>
</html>
