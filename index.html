<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マニュアル作成ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.2.31"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.7.1/dist/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="bg-gray-100">

  <div id="app" class="max-w-4xl mx-auto p-6">
    <h1 class="text-4xl font-bold mb-6 text-center text-indigo-600">マニュアル作成ツール</h1>

    <!-- 検索機能 -->
    <div class="flex mb-4">
      <input v-model="searchQuery" type="text" placeholder="検索..." class="w-full p-3 border rounded-lg" />
    </div>

    <!-- カテゴリ選択 -->
    <div class="mb-4">
      <select v-model="selectedCategory" class="w-full p-3 border rounded-lg">
        <option value="">全てのカテゴリ</option>
        <option v-for="category in categories" :key="category" :value="category">{{ category }}</option>
      </select>
    </div>

    <!-- マニュアルリスト -->
    <div v-for="(item, index) in filteredManuals" :key="item.id" class="rounded-xl shadow-md bg-white p-6 mb-4">
      <div v-if="editingId === item.id">
        <textarea v-model="editText" class="mb-4 w-full p-3 border rounded-lg"></textarea>
        <div class="flex justify-end space-x-2">
          <button @click="updateManual(item.id)" class="bg-blue-500 text-white px-4 py-2 rounded-lg">保存</button>
          <button @click="cancelEdit" class="bg-gray-300 text-black px-4 py-2 rounded-lg">キャンセル</button>
        </div>
      </div>
      <div v-else>
        <div class="flex justify-between items-start">
          <p class="text-base text-gray-800">{{ item.text }}</p>
          <div class="relative inline-block">
            <button @click="startEditing(item.id, item.text)" class="text-gray-500 px-3 py-2 hover:bg-gray-200 rounded-lg">編集</button>
            <button @click="deleteManual(item.id)" class="text-red-500 px-3 py-2 hover:bg-gray-200 rounded-lg">削除</button>
          </div>
        </div>
        <div class="mt-2">
          <span class="inline-block bg-gray-200 text-gray-800 text-xs px-3 py-1 rounded-lg mr-2" v-for="tag in item.tags" :key="tag">{{ tag }}</span>
        </div>
      </div>
    </div>

    <!-- 新しいマニュアル作成 -->
    <div class="mt-6">
      <textarea v-model="newManual" placeholder="新しいマニュアルを入力..." class="mb-4 w-full p-3 border rounded-lg"></textarea>

      <!-- カテゴリとタグの選択 -->
      <div class="mb-4">
        <select v-model="newCategory" class="w-full p-3 border rounded-lg">
          <option value="">カテゴリを選択</option>
          <option v-for="category in categories" :key="category" :value="category">{{ category }}</option>
        </select>
      </div>

      <!-- テンプレートボタン -->
      <div class="space-x-2 mb-4">
        <button v-for="(tpl, idx) in templates" :key="idx" @click="applyTemplate(tpl)" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg">
          {{ tpl }}
        </button>
      </div>

      <!-- 画像挿入 -->
      <input type="file" @change="handleImageUpload" class="mb-4" />

      <!-- 新しいマニュアル送信ボタン -->
      <button @click="addManual" class="bg-blue-500 text-white px-4 py-2 rounded-lg">マニュアル作成</button>
    </div>

    <!-- フィードバック収集 -->
    <div class="mt-6">
      <textarea v-model="feedbackText" placeholder="フィードバックを入力..." class="w-full p-3 border rounded-lg"></textarea>
      <button @click="submitFeedback" class="bg-green-500 text-white px-4 py-2 rounded-lg mt-2">フィードバック送信</button>
    </div>

    <!-- PDFエクスポートボタン -->
    <div class="mt-6 text-center">
      <button @click="exportToPDF" class="bg-indigo-500 text-white px-4 py-2 rounded-lg">PDFとしてエクスポート</button>
    </div>

  </div>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          manualList: [
            { id: 1, text: "会社の基本的な手順に従う方法についての説明。", category: "運用", tags: ["手順", "基本"] },
            { id: 2, text: "製品の使用方法についての詳細なガイド。", category: "製品", tags: ["インストール", "製品"] },
          ],
          newManual: "",
          editText: "",
          editingId: null,
          selectedCategory: "",
          newCategory: "",
          searchQuery: "",
          feedbackText: "",
          categories: ["運用", "製品", "トラブルシューティング", "インストール", "手順"],
          templates: [
            "操作手順：...",
            "インストール手順：...",
            "トラブルシューティング：...",
          ],
          image: null,
        };
      },
      computed: {
        filteredManuals() {
          return this.manualList.filter((item) => {
            const matchesCategory = this.selectedCategory ? item.category === this.selectedCategory : true;
            const matchesSearch = item.text.toLowerCase().includes(this.searchQuery.toLowerCase());
            return matchesCategory && matchesSearch;
          });
        }
      },
      methods: {
        addManual() {
          if (this.newManual.trim()) {
            this.manualList.push({
              id: Date.now(),
              text: this.newManual,
              category: this.newCategory,
              tags: ["新しいタグ"],
            });
            this.newManual = "";
            this.newCategory = "";
          }
        },
        deleteManual(id) {
          this.manualList = this.manualList.filter((item) => item.id !== id);
        },
        startEditing(id, currentText) {
          this.editingId = id;
          this.editText = currentText;
        },
        cancelEdit() {
          this.editingId = null;
          this.editText = "";
        },
        updateManual(id) {
          const index = this.manualList.findIndex((item) => item.id === id);
          if (index !== -1) {
            this.manualList[index].text = this.editText;
          }
          this.cancelEdit();
        },
        applyTemplate(text) {
          this.newManual = text;
        },
        handleImageUpload(event) {
          const file = event.target.files[0];
          const reader = new FileReader();
          reader.onload = (e) => {
            this.image = e.target.result;
          };
          reader.readAsDataURL(file);
        },
        submitFeedback() {
          alert(`フィードバックが送信されました: ${this.feedbackText}`);
          this.feedbackText = "";
        },
        exportToPDF() {
          const doc = new jsPDF();
          this.manualList.forEach((item, index) => {
            doc.text(`マニュアル ${index + 1}: ${item.text}`, 10, 10 + index * 10);
          });
          doc.save('manuals.pdf');
        }
      },
    });

    app.mount("#app");
  </script>

</body>
</html>
