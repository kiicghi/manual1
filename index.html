<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マニュアル作成ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.2.31"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.7.1/dist/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    .shadow-card {
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      background-color: white;
      padding: 20px;
    }

    .button {
      display: inline-block;
      background-color: #4c51bf;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      text-align: center;
      cursor: pointer;
    }

    .button:hover {
      background-color: #434190;
    }

    .button-secondary {
      background-color: #e2e8f0;
      color: #2d3748;
    }

    .button-secondary:hover {
      background-color: #cbd5e0;
    }

    .input-field {
      width: 100%;
      padding: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .select-category {
      width: 100%;
      padding: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background-color: #f7fafc;
    }

    .file-upload {
      border: 2px dashed #a0aec0;
      padding: 20px;
      width: 100%;
      border-radius: 8px;
      text-align: center;
      color: #a0aec0;
    }

    .sidebar {
      width: 250px;
      float: left;
      padding: 20px;
    }

    .content {
      margin-left: 270px;
      padding: 20px;
    }

    .manual-title {
      cursor: pointer;
      padding: 10px;
      background-color: #f7fafc;
      border: 1px solid #e2e8f0;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .manual-title:hover {
      background-color: #edf2f7;
    }

    .input-field-large {
      width: 100%;
      padding: 15px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 1.2rem;
      min-height: 200px;
    }

    .file-upload {
      border: 2px dashed #a0aec0;
      padding: 20px;
      width: 100%;
      border-radius: 8px;
      text-align: center;
      color: #a0aec0;
    }

    .action-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }
  </style>
</head>
<body class="bg-gray-50">

  <div id="app" class="max-w-full mx-auto p-6">
    <div class="flex">
      <!-- 左サイドバー -->
      <div class="sidebar">
        <h2 class="text-xl font-bold text-indigo-600 mb-4">既存マニュアル</h2>
        <input v-model="searchQuery" type="text" placeholder="検索..." class="input-field mb-4" />
        
        <div v-for="(item, index) in filteredManuals" :key="item.id" @click="selectManual(item.id)" class="manual-title">
          <p class="text-lg text-gray-700">{{ item.text.slice(0, 20) }}...</p>
        </div>
      </div>

      <!-- 右側のコンテンツエリア -->
      <div class="content">
        <h2 class="text-2xl font-bold text-indigo-600 mb-4">新しいマニュアル作成</h2>

        <!-- 新しいマニュアル入力エリア -->
        <textarea v-model="newManual" placeholder="新しいマニュアルを入力..." class="input-field-large"></textarea>

        <div>
          <select v-model="newCategory" class="select-category">
            <option value="">カテゴリを選択</option>
            <option v-for="category in categories" :key="category" :value="category">{{ category }}</option>
          </select>
        </div>

        <div class="file-upload mt-4">
          <input type="file" @change="handleImageUpload" class="mb-4" />
          <p>画像をアップロード</p>
        </div>

        <div class="action-buttons">
          <button @click="addManual" class="button w-1/3">マニュアル作成</button>
          <button @click="exportToPDF" class="button w-1/3">PDFとしてエクスポート</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          manualList: [
            { id: 1, text: "会社の基本的な手順に従う方法についての説明。", category: "運用", tags: ["手順", "基本"] },
            { id: 2, text: "製品の使用方法についての詳細なガイド。", category: "製品", tags: ["インストール", "製品"] },
          ],
          newManual: "",
          selectedManual: null,
          newCategory: "",
          searchQuery: "",
          categories: ["運用", "製品", "トラブルシューティング", "インストール", "手順"],
          image: null,
        };
      },
      computed: {
        filteredManuals() {
          return this.manualList.filter((item) => {
            return item.text.toLowerCase().includes(this.searchQuery.toLowerCase());
          });
        }
      },
      methods: {
        addManual() {
          if (this.newManual.trim()) {
            this.manualList.push({
              id: Date.now(),
              text: this.newManual,
              category: this.newCategory,
              tags: ["新しいタグ"],
            });
            this.newManual = "";
            this.newCategory = "";
          }
        },
        selectManual(id) {
          this.selectedManual = this.manualList.find(item => item.id === id);
        },
        handleImageUpload(event) {
          const file = event.target.files[0];
          const reader = new FileReader();
          reader.onload = (e) => {
            this.image = e.target.result;
          };
          reader.readAsDataURL(file);
        },
        exportToPDF() {
          const doc = new jsPDF();
          this.manualList.forEach((item, index) => {
            doc.text(`マニュアル ${index + 1}: ${item.text}`, 10, 10 + index * 10);
          });
          doc.save('manuals.pdf');
        }
      },
    });

    app.mount("#app");
  </script>

</body>
</html>
