<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マニュアル作成ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.2.31"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.7.1/dist/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    .shadow-card {
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      background-color: white;
      padding: 20px;
    }

    .button {
      display: inline-block;
      background-color: #4c51bf;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      text-align: center;
      cursor: pointer;
    }

    .button:hover {
      background-color: #434190;
    }

    .button-secondary {
      background-color: #e2e8f0;
      color: #2d3748;
    }

    .button-secondary:hover {
      background-color: #cbd5e0;
    }

    .input-field {
      width: 100%;
      padding: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .select-category {
      width: 100%;
      padding: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background-color: #f7fafc;
    }

    .file-upload {
      border: 2px dashed #a0aec0;
      padding: 20px;
      width: 100%;
      border-radius: 8px;
      text-align: center;
      color: #a0aec0;
    }
  </style>
</head>
<body class="bg-gray-50">

  <div id="app" class="max-w-4xl mx-auto p-6 space-y-6">
    <h1 class="text-4xl font-bold text-center text-indigo-600">マニュアル作成ツール</h1>

    <!-- 検索機能 -->
    <div>
      <input v-model="searchQuery" type="text" placeholder="検索..." class="input-field" />
    </div>

    <!-- カテゴリ選択 -->
    <div>
      <select v-model="selectedCategory" class="select-category">
        <option value="">全てのカテゴリ</option>
        <option v-for="category in categories" :key="category" :value="category">{{ category }}</option>
      </select>
    </div>

    <!-- マニュアルリスト -->
    <div v-for="(item, index) in filteredManuals" :key="item.id" class="shadow-card mb-4">
      <div v-if="editingId === item.id">
        <textarea v-model="editText" class="input-field mb-4" rows="4"></textarea>
        <div class="flex justify-end space-x-2">
          <button @click="updateManual(item.id)" class="button">保存</button>
          <button @click="cancelEdit" class="button button-secondary">キャンセル</button>
        </div>
      </div>
      <div v-else>
        <div class="flex justify-between items-start">
          <p class="text-lg text-gray-700">{{ item.text }}</p>
          <div>
            <button @click="startEditing(item.id, item.text)" class="text-indigo-500 mr-2">編集</button>
            <button @click="deleteManual(item.id)" class="text-red-500">削除</button>
          </div>
        </div>
        <div class="mt-2">
          <span class="inline-block bg-gray-200 text-gray-700 text-xs px-3 py-1 rounded-lg mr-2" v-for="tag in item.tags" :key="tag">{{ tag }}</span>
        </div>
      </div>
    </div>

    <!-- 新しいマニュアル作成 -->
    <div class="shadow-card">
      <textarea v-model="newManual" placeholder="新しいマニュアルを入力..." class="input-field" rows="4"></textarea>

      <div>
        <select v-model="newCategory" class="select-category">
          <option value="">カテゴリを選択</option>
          <option v-for="category in categories" :key="category" :value="category">{{ category }}</option>
        </select>
      </div>

      <!-- テンプレートボタン -->
      <div class="space-x-2 mb-4">
        <button v-for="(tpl, idx) in templates" :key="idx" @click="applyTemplate(tpl)" class="button button-secondary">
          {{ tpl }}
        </button>
      </div>

      <!-- 画像挿入 -->
      <div class="file-upload">
        <input type="file" @change="handleImageUpload" class="mb-4" />
        <p>画像をアップロード</p>
      </div>

      <button @click="addManual" class="button w-full">マニュアル作成</button>
    </div>

    <!-- フィードバック収集 -->
    <div class="shadow-card">
      <textarea v-model="feedbackText" placeholder="フィードバックを入力..." class="input-field" rows="4"></textarea>
      <button @click="submitFeedback" class="button w-full mt-2">フィードバック送信</button>
    </div>

    <!-- PDFエクスポートボタン -->
    <div class="text-center">
      <button @click="exportToPDF" class="button">PDFとしてエクスポート</button>
    </div>
  </div>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          manualList: [
            { id: 1, text: "会社の基本的な手順に従う方法についての説明。", category: "運用", tags: ["手順", "基本"] },
            { id: 2, text: "製品の使用方法についての詳細なガイド。", category: "製品", tags: ["インストール", "製品"] },
          ],
          newManual: "",
          editText: "",
          editingId: null,
          selectedCategory: "",
          newCategory: "",
          searchQuery: "",
          feedbackText: "",
          categories: ["運用", "製品", "トラブルシューティング", "インストール", "手順"],
          templates: [
            "操作手順：...",
            "インストール手順：...",
            "トラブルシューティング：...",
          ],
          image: null,
        };
      },
      computed: {
        filteredManuals() {
          return this.manualList.filter((item) => {
            const matchesCategory = this.selectedCategory ? item.category === this.selectedCategory : true;
            const matchesSearch = item.text.toLowerCase().includes(this.searchQuery.toLowerCase());
            return matchesCategory && matchesSearch;
          });
        }
      },
      methods: {
        addManual() {
          if (this.newManual.trim()) {
            this.manualList.push({
              id: Date.now(),
              text: this.newManual,
              category: this.newCategory,
              tags: ["新しいタグ"],
            });
            this.newManual = "";
            this.newCategory = "";
          }
        },
        deleteManual(id) {
          this.manualList = this.manualList.filter((item) => item.id !== id);
        },
        startEditing(id, currentText) {
          this.editingId = id;
          this.editText = currentText;
        },
        cancelEdit() {
          this.editingId = null;
          this.editText = "";
        },
        updateManual(id) {
          const index = this.manualList.findIndex((item) => item.id === id);
          if (index !== -1) {
            this.manualList[index].text = this.editText;
          }
          this.cancelEdit();
        },
        applyTemplate(text) {
          this.newManual = text;
        },
        handleImageUpload(event) {
          const file = event.target.files[0];
          const reader = new FileReader();
          reader.onload = (e) => {
            this.image = e.target.result;
          };
          reader.readAsDataURL(file);
        },
        submitFeedback() {
          alert(`フィードバックが送信されました: ${this.feedbackText}`);
          this.feedbackText = "";
        },
        exportToPDF() {
          const doc = new jsPDF();
          this.manualList.forEach((item, index) => {
            doc.text(`マニュアル ${index + 1}: ${item.text}`, 10, 10 + index * 10);
          });
          doc.save('manuals.pdf');
        }
      },
    });

    app.mount("#app");
  </script>

</body>
</html>
