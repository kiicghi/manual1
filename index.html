<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マニュアル作成ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.2.31"></script>
  <style>
    .shadow-card {
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      background-color: white;
      padding: 20px;
    }

    .button {
      display: inline-block;
      background-color: #4c51bf;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      text-align: center;
      cursor: pointer;
    }

    .button:hover {
      background-color: #434190;
    }

    .button-secondary {
      background-color: #e2e8f0;
      color: #2d3748;
    }

    .button-secondary:hover {
      background-color: #cbd5e0;
    }

    .input-field {
      width: 100%;
      padding: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .select-category {
      width: 100%;
      padding: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background-color: #f7fafc;
      margin-bottom: 15px;
    }

    .sidebar {
      width: 250px;
      float: left;
      padding: 20px;
    }

    .content {
      margin-left: 270px;
      padding: 20px;
    }

    .manual-title {
      cursor: pointer;
      padding: 10px;
      background-color: #f7fafc;
      border: 1px solid #e2e8f0;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .manual-title:hover {
      background-color: #edf2f7;
    }

    .input-field-large {
      width: 100%;
      padding: 15px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 1.2rem;
      min-height: 200px;
    }

    .action-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    /* レスポンシブデザイン */
    @media screen and (max-width: 1024px) {
      .sidebar {
        width: 100%;
        margin-bottom: 20px;
      }

      .content {
        margin-left: 0;
      }
    }

    @media screen and (max-width: 640px) {
      .manual-title {
        font-size: 14px;
      }

      .input-field-large {
        font-size: 1rem;
      }

      .input-field, .select-category {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body class="bg-gray-50">

  <div id="app" class="max-w-full mx-auto p-6">
    <div class="flex flex-wrap">
      <!-- 左サイドバー -->
      <div class="sidebar">
        <input v-model="searchQuery" type="text" placeholder="検索..." class="input-field mb-4" />

        <div v-for="(item, index) in filteredManuals" :key="item.id" @click="selectManual(item.id)" class="manual-title">
          <p class="text-lg text-gray-700">{{ item.text.slice(0, 20) }}...</p>
        </div>
      </div>

      <!-- 右側のコンテンツエリア -->
      <div class="content">
        <h2 class="text-2xl font-bold text-indigo-600 mb-4">新しいマニュアル作成</h2>

        <!-- カテゴリ選択 -->
        <select v-model="newCategory" class="select-category">
          <option value="">カテゴリを選択</option>
          <option v-for="category in categories" :key="category" :value="category">{{ category }}</option>
        </select>

        <!-- 新しいマニュアル入力欄 -->
        <textarea v-model="newManual" placeholder="新しいマニュアルを入力..." class="input-field-large"></textarea>

        <!-- アクションボタン -->
        <div class="action-buttons">
          <button @click="addManual" class="button w-1/3">マニュアル作成</button>
        </div>

        <!-- マニュアル詳細 -->
        <div v-if="selectedManual" class="mt-8 shadow-card">
          <h3 class="text-xl font-bold text-gray-800">マニュアル詳細</h3>
          <p><strong>カテゴリ:</strong> {{ selectedManual.category }}</p>
          <p><strong>内容:</strong> {{ selectedManual.text }}</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          manualList: [
            { id: 1, text: "会社の基本的な手順に従う方法についての説明。", category: "運用", tags: ["手順", "基本"] },
            { id: 2, text: "製品の使用方法についての詳細なガイド。", category: "製品", tags: ["インストール", "製品"] },
          ],
          newManual: "",
          selectedManual: null,
          newCategory: "",
          searchQuery: "",
          categories: ["運用", "製品", "トラブルシューティング", "インストール", "手順"],
        };
      },
      computed: {
        filteredManuals() {
          return this.manualList.filter((item) => {
            return item.text.toLowerCase().includes(this.searchQuery.toLowerCase());
          });
        }
      },
      methods: {
        addManual() {
          if (this.newManual.trim()) {
            this.manualList.push({
              id: Date.now(),
              text: this.newManual,
              category: this.newCategory,
              tags: ["新しいタグ"],
            });
            this.newManual = "";
            this.newCategory = "";
          }
        },
        selectManual(id) {
          this.selectedManual = this.manualList.find(item => item.id === id);
        }
      },
    });

    app.mount("#app");
  </script>

</body>
</html>
